name: Talel CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talel_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talel_test?schema=public
      COOKIE_SECRET: ci-only-cookie-secret-at-least-32-characters-long
      APP_ORIGINS: http://localhost:3001,http://localhost:3002,http://localhost:3003
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: seller/server
      - run: npx prisma validate
        working-directory: seller/server
      - run: npm run db:deploy
        working-directory: seller/server
      - run: npm run test:integration
        working-directory: seller/server
      - run: npm test
        working-directory: seller/server
      - run: npm run build
        working-directory: seller/server

  frontends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, seller, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npm run build
        working-directory: ${{ matrix.app }}
